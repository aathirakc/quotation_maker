<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

	<title>Quotation Maker</title>

	<!-- Google font -->
	<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">

	<!-- Bootstrap -->
	<link type="text/css" rel="stylesheet" href="/static/user/css/bootstrap.min.css" />

	<!-- Custom stlylesheet -->
	<link type="text/css" rel="stylesheet" href="/static/user/css/style.css" />

	<!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
	<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
	<!--[if lt IE 9]>
		  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
		  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
		<![endif]-->

</head>

<body>
	<div class="section">
		<img src="/static/user/img/img.jpg" width="1400">
		<div class="section-center">
			<div class="container">
				<div class="row">
					<div class="col-md-7 col-md-push-6">

					</div>
					<div class="col-md-4 col-md-pull-3">
						<div class="booking-form">
							<form action="/adding/{{a}}" method="post" enctype="multipart/form-data" >
								<input type="text" name="id"  value="{{ a }}" hidden/>
								<div class="form-group">
									<div class="row">
									<div class="col-sm-9">
										<div class="form-group">
											<span class="form-label" >Items</span>
											<select class="form-control" name="textfield1">
												<option>Men FUEL Jordan LC 2</option>
												<option>Unistar Steel Toe Fabric Safety Shoe</option>
												<option>FUEL Shank</option>
												<option>Karam PN 56</option>
												<option>Convex Mirror</option>
												<option>Double Catridge MG4200</option>
											</select>
											<span class="select-arrow"></span>
										</div>
									</div>

								</div>
								<div class="form-group">
									<span class="form-label">Enter price</span>
									<input class="form-control" id="amount" name="textfield2" type="number" oninput="calculateGST()">
									<!--<input class="form-control" type="text" placeholder="Enter a destination or hotel name">-->
								</div>

									<div class="form-group">

									<span class="form-label">GST%</span>
									<input class="form-control" id="gstRate" name="textfield3" type="number" oninput="calculateGST()">
								</div>



								<div class="form-btn">
									<input type="submit" name="button" id="button" value="Done" style="background-color: #000080; color: white; border: none; padding: 10px 20px;" class="form-control"  />
								</div>
								</div></form>
							<div class="result">

    </div>

        <h4>GST Amount: <span id="gstOutput">0.00</span></h4>
        <h4>Total Amount: <span id="totalOutput">0.00</span></h4>
    </div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
<script>
function calculateGST() {
    const amount = parseFloat(document.getElementById('amount').value) || 0;
    const gstRate = parseFloat(document.getElementById('gstRate').value) || 0;

    const gstAmount = (amount * gstRate) / 100;
    const totalAmount = amount + gstAmount;

    document.getElementById('gstOutput').innerText = gstAmount.toFixed(2);
    document.getElementById('totalOutput').innerText = totalAmount.toFixed(2);
}
</script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->

</html>
