<!doctype html>
<html lang="en">
  <head>
  	<title>QUOTATION MAKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="/static/user/adding_index/css/style.css">

	</head>
	<body>


	<section class="ftco-section">


		<div class="container">



			<div class="row justify-content-center">


			</div>
			<div class="row">

				<div class="col-md-12">
					<h3 class="h5 mb-4 text-center">Table Accordion</h3>


<div class="form-group">
									<span class="form-label">Customer Name</span>
									<input class="form-control"  name="textfield2"  value="{{data1.name}}">
									<!--<input class="form-control" type="text" placeholder="Enter a destination or hotel name">-->
								</div>
					<div class="form-group">
									<span class="form-label">Address</span>
									<input class="form-control"  name="textfield2"  value="{{data1.address}}">
									<!--<input class="form-control" type="text" placeholder="Enter a destination or hotel name">-->
								</div>
					<div class="form-group">
									<span class="form-label">Phone Number</span>
									<input class="form-control"  name="textfield2"  value="{{data1.phonenumber}}">
									<!--<input class="form-control" type="text" placeholder="Enter a destination or hotel name">-->
								</div>





					<div class="table-wrap">
						<table class="table">
						  <thead class="thead-primary">
						    <tr>

						    	<th>#</th>
						    	<th>Product</th>
						      <th>Price</th>

						      <th>gst</th>
						      <th>total</th>
						      <th>&nbsp;</th>
						    </tr>
						  </thead>
						  <tbody>
						   {% for i in data %}
						    <tr class="alert" role="alert">


						    	<td>
						    		<div class="img" style="background-image: url(/static/user/adding_index/images/product-1.png);"></div>
						    	</td>

						      <td>

						      		<span>{{ i['item'] }} </span>


						      </td>

						      <td>{{i['price']}}</td>
						      <td>{{i['gst']}}</td>
						      <td>{{i['total']}}</td>


						      <td>
						      	<a href="/delete_item/{{ i['id'] }}"> &times;</a>
				        	</td>
						    </tr>
						   {% endfor %}




						  </tbody>
						</table>

						<a href="/more_items/{{data1.id}}"><button type="button"  style="background-color: #000080; color: white; border: none;"  class="form-control" >Add Items</button></a><br>

						<a href="/submit/{{data1.id}}"><button type="submit" style="background-color: #149403; color: white; border: none; padding: 10px 20px;" class="form-control" >submit</button></a>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="/static/user/adding_index/js/jquery.min.js"></script>
  <script src="/static/user/adding_index/js/popper.js"></script>
  <script src="/static/user/adding_index/js/bootstrap.min.js"></script>
  <script src="/static/user/adding_index/js/main.js"></script>

</div></body>
</html>
